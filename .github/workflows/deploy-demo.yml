name: Deploy Demo

on:
  push:
    branches: [main]
    paths:
      - 'src/demo/**'
      - 'src/lib/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'index.html'

concurrency:
  group: 'pages'
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - run: bun install
      - run: bun run build:demo

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist-demo
          branch: gh-pages
